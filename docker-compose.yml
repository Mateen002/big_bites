services:
  postgres:
    image: postgres:16-alpine
    container_name: bigbites-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bigbites
      POSTGRES_PASSWORD: bigbites
      POSTGRES_DB: bigbites
    ports:
      - "5432:5432"
    volumes:
      - bigbites_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bigbites"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bigbites-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bigbites_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  bigbites_pg:
  bigbites_redis:
