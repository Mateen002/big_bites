services:
  - type: web
    name: bigbites-api
    runtime: node
    plan: free
    region: singapore # Closest to Pakistan for low latency
    buildCommand: pnpm install && pnpm run build:api
    startCommand: pnpm run start:api
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: http://localhost:3000,http://localhost:3001
      - key: ADMIN_EMAIL
        value: admin@bigbites.pk
      - key: ADMIN_PASSWORD
        sync: false
